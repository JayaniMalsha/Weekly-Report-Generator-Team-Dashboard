<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #64748b; }
      .entity-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 12px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
      .entity-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .field { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #334155; }
      .field-pk { font-weight: bold; fill: #2563eb; }
      .field-fk { font-style: italic; fill: #7c3aed; }
      .field-type { fill: #94a3b8; }
      .line { stroke: #94a3b8; stroke-width: 2px; stroke-dasharray: 4 4; }
      .line-solid { stroke: #64748b; stroke-width: 2px; }
      .badge { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; }
    </style>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" class="bg" />

  <!-- Diagram Title -->
  <text x="50" y="50" class="title">Weekly Report Generator &amp; Team Dashboard — Database ER Diagram</text>
  <text x="50" y="75" class="subtitle">Entity Relationship Architecture with Full Review Lifecycle, Snapshot Versioning, and RBAC</text>

  <!-- ENTITY: USER -->
  <g transform="translate(50, 120)">
    <rect width="250" height="270" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 40 L 0 40 Z" fill="url(#grad-blue)" />
    <text x="15" y="26" class="entity-header">USER</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field">email : String (Unique)</text>
    <text x="15" y="105" class="field">password : String (Hashed)</text>
    <text x="15" y="125" class="field">name : String</text>
    <text x="15" y="145" class="field">role : Enum (MEMBER/MGR/ADMIN)</text>
    <text x="15" y="165" class="field">department : String</text>
    <text x="15" y="185" class="field">avatar : String?</text>
    <text x="15" y="205" class="field field-type">createdAt : DateTime</text>
    <text x="15" y="225" class="field field-type">updatedAt : DateTime</text>
  </g>

  <!-- ENTITY: PROJECT -->
  <g transform="translate(50, 480)">
    <rect width="250" height="230" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 40 L 0 40 Z" fill="url(#grad-emerald)" />
    <text x="15" y="26" class="entity-header">PROJECT</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field">name : String</text>
    <text x="15" y="105" class="field">code : String (Unique)</text>
    <text x="15" y="125" class="field">color : String (Hex)</text>
    <text x="15" y="145" class="field">status : Enum (Active/Hold)</text>
    <text x="15" y="165" class="field field-type">createdAt : DateTime</text>
    <text x="15" y="185" class="field field-type">updatedAt : DateTime</text>
  </g>

  <!-- ENTITY: USER_PROJECT -->
  <g transform="translate(50, 750)">
    <rect width="250" height="110" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 35 L 0 35 Z" fill="#64748b" />
    <text x="15" y="23" class="entity-header">USER_PROJECT</text>
    <text x="15" y="55" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="75" class="field field-fk">🔗 userId : FK -> USER.id</text>
    <text x="15" y="95" class="field field-fk">🔗 projectId : FK -> PROJECT.id</text>
  </g>

  <!-- ENTITY: REPORT -->
  <g transform="translate(430, 120)">
    <rect width="320" height="460" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 40 L 0 40 Z" fill="url(#grad-indigo)" />
    <text x="15" y="26" class="entity-header">REPORT</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field field-fk">🔗 userId : FK -> USER.id</text>
    <text x="15" y="105" class="field field-fk">🔗 projectId : FK -> PROJECT.id</text>
    <text x="15" y="125" class="field">weekNumber : Int (1-53)</text>
    <text x="15" y="145" class="field">year : Int (e.g. 2026)</text>
    <text x="15" y="165" class="field field-type">startDate : DateTime (Mon 00:00)</text>
    <text x="15" y="185" class="field field-type">endDate : DateTime (Sun 23:59)</text>
    <text x="15" y="205" class="field field-type">dueDate : DateTime (Fri 18:00)</text>
    <text x="15" y="225" class="field">status : Draft / Submitted / Correction / Approved</text>
    <text x="15" y="245" class="field">isLate : Boolean (submittedAt > dueDate)</text>
    <text x="15" y="265" class="field field-type">submittedAt : DateTime?</text>
    <text x="15" y="285" class="field field-type">approvedAt : DateTime?</text>
    <text x="15" y="305" class="field">tasksPlannedNextWeek : JSON Array</text>
    <text x="15" y="325" class="field">blockers : JSON Array [text, isKey]</text>
    <text x="15" y="345" class="field">achievements : JSON Array [text, isKey]</text>
    <text x="15" y="365" class="field">hoursBreakdown : JSON Object</text>
    <text x="15" y="385" class="field">notes : String?</text>
    <text x="15" y="405" class="field">links : String?</text>
    <text x="15" y="425" class="field field-type">createdAt / updatedAt : DateTime</text>
  </g>

  <!-- ENTITY: TASK -->
  <g transform="translate(860, 120)">
    <rect width="290" height="260" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 278 0 Q 290 0 290 12 L 290 40 L 0 40 Z" fill="url(#grad-blue)" />
    <text x="15" y="26" class="entity-header">TASK (Completed Task Table)</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field field-fk">🔗 reportId : FK -> REPORT.id</text>
    <text x="15" y="105" class="field">name : String</text>
    <text x="15" y="125" class="field">priority : Low / Med / High / Urgent</text>
    <text x="15" y="145" class="field">plannedPercent : Int (0-100)</text>
    <text x="15" y="165" class="field">actualPercent : Int (0-100)</text>
    <text x="15" y="185" class="field">status : Completed / In Progress / Blocked</text>
    <text x="15" y="205" class="field">timePlannedHours : Float</text>
    <text x="15" y="225" class="field">timeSpentHours : Float</text>
    <text x="15" y="245" class="field">outputDeliverable : String?</text>
  </g>

  <!-- ENTITY: REVIEW_COMMENT -->
  <g transform="translate(430, 650)">
    <rect width="320" height="190" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 40 L 0 40 Z" fill="url(#grad-amber)" />
    <text x="15" y="26" class="entity-header">REVIEW_COMMENT</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field field-fk">🔗 reportId : FK -> REPORT.id</text>
    <text x="15" y="105" class="field field-fk">🔗 authorId : FK -> USER.id (Manager)</text>
    <text x="15" y="125" class="field">action : APPROVE / REQUEST_CHANGES</text>
    <text x="15" y="145" class="field">comment : String (Feedback note)</text>
    <text x="15" y="165" class="field">versionNumber : Int</text>
    <text x="15" y="185" class="field field-type">createdAt : DateTime</text>
  </g>

  <!-- ENTITY: REPORT_VERSION -->
  <g transform="translate(860, 480)">
    <rect width="290" height="240" class="entity-box" />
    <path d="M 0 12 Q 0 0 12 0 L 278 0 Q 290 0 290 12 L 290 40 L 0 40 Z" fill="url(#grad-purple)" />
    <text x="15" y="26" class="entity-header">REPORT_VERSION (Snapshot)</text>
    <text x="15" y="65" class="field field-pk">🔑 id : String (UUID)</text>
    <text x="15" y="85" class="field field-fk">🔗 reportId : FK -> REPORT.id</text>
    <text x="15" y="105" class="field">versionNumber : Int (1, 2, ...)</text>
    <text x="15" y="125" class="field field-type">submittedAt : DateTime</text>
    <text x="15" y="145" class="field field-fk">🔗 submittedById : FK -> USER.id</text>
    <text x="15" y="165" class="field">snapshot : String (Full JSON dump)</text>
    <text x="15" y="185" class="field field-fk">🔗 reviewCommentId : FK -> REVIEW_COMMENT.id</text>
    <text x="15" y="205" class="field">statusAtSnapshot : String</text>
  </g>

  <!-- Relationships Lines -->
  <!-- USER to REPORT -->
  <path d="M 300 220 L 430 220" class="line-solid" />
  <circle cx="305" cy="220" r="3" fill="#2563eb" />
  <text x="330" y="210" class="subtitle" font-size="11">1 : N reports</text>

  <!-- PROJECT to REPORT -->
  <path d="M 300 550 L 370 550 L 370 280 L 430 280" class="line-solid" />
  <text x="315" y="540" class="subtitle" font-size="11">1 : N</text>

  <!-- REPORT to TASK -->
  <path d="M 750 220 L 860 220" class="line-solid" />
  <circle cx="855" cy="220" r="3" fill="#4f46e5" />
  <text x="780" y="210" class="subtitle" font-size="11">1 : N tasks</text>

  <!-- REPORT to REVIEW_COMMENT -->
  <path d="M 580 580 L 580 650" class="line-solid" />
  <text x="590" y="620" class="subtitle" font-size="11">1 : N reviews</text>

  <!-- REPORT to REPORT_VERSION -->
  <path d="M 750 350 L 810 350 L 810 520 L 860 520" class="line-solid" />
  <text x="760" y="340" class="subtitle" font-size="11">1 : N snapshots</text>

  <!-- REVIEW_COMMENT to REPORT_VERSION -->
  <path d="M 750 720 L 860 720" class="line" stroke="#d97706" />
  <text x="760" y="710" class="subtitle" font-size="11" fill="#d97706">links version to comment</text>

</svg>
